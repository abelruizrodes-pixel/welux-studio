<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba vídeo hero</title>
<link rel="stylesheet" href="/assets/css/welux-v2.css">
<style>
.welux-hero-video{position:absolute;top:0;left:0;right:0;height:680px;overflow:hidden;pointer-events:none}
.welux-hero-video video{width:100%;height:100%;object-fit:cover;display:block}
#estado{position:relative;z-index:2;background:#fff;color:#111;font:16px/1.5 monospace;padding:12px;margin:700px 16px 16px}
h1{position:relative;z-index:2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);margin:40px 16px}
</style>
</head>
<body>
<div class="welux-hero-video" aria-hidden="true">
<video id="welux-hero-video" src="/assets/videos/welux-hero-luxemburgo.mp4" poster="/assets/images/luxemburgo-header.jpg" muted loop playsinline autoplay preload="auto" data-video-fondo="hero"></video>
</div>
<h1>Prueba vídeo hero</h1>
<p id="estado">cargando…</p>
<script src="/assets/js/welux-v2.js" defer></script>
<script>
window.addEventListener('load', function () {
  var v = document.getElementById('welux-hero-video');
  var p = document.getElementById('estado');
  function info() {
    return 'paused=' + v.paused + ' readyState=' + v.readyState + ' currentTime=' + v.currentTime.toFixed(2) + ' videoWidth=' + v.videoWidth + ' error=' + (v.error ? v.error.code : 'no');
  }
  p.textContent = 'T0: ' + info();
  setTimeout(function () { p.textContent += ' | T2s: ' + info(); }, 2000);
  setTimeout(function () { p.textContent += ' | T5s: ' + info(); }, 5000);
});
</script>
</body>
</html>
